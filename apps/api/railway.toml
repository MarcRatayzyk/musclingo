[build]
buildCommand = "pnpm --filter @muscle-mind/api build"
watchPatterns = [
  "/apps/api/**",
  "/packages/types/**",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/turbo.json"
]

[deploy]
startCommand = "pnpm --filter @muscle-mind/api start"
# Requis: DATABASE_URL (ref Postgres), JWT_ACCESS_SECRET, JWT_REFRESH_SECRET
# Optionnel: REDIS_URL, CORS_ORIGINS=*, SKIP_SEED=1 apres le 1er seed
# Networking: Generate Domain (public) pour que l'APK puisse joindre l'API
